<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iCore API Control Tower</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3e;
      --accent:   #4f8ef7;
      --green:    #22c55e;
      --yellow:   #f59e0b;
      --red:      #ef4444;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --sidebar-w: 280px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #fff;
    }

    .logo-text { font-size: 15px; font-weight: 600; }
    .logo-sub  { font-size: 11px; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }

    .search {
      margin-top: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 13px;
      width: 100%;
      outline: none;
    }
    .search::placeholder { color: var(--muted); }
    .search:focus { border-color: var(--accent); }

    .sidebar-section {
      padding: 12px 16px 4px;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .api-list { overflow-y: auto; flex: 1; }

    .api-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .15s;
      position: relative;
    }
    .api-item:hover { background: rgba(79,142,247,.06); }
    .api-item.active {
      background: rgba(79,142,247,.12);
      border-left-color: var(--accent);
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    .dot.red    { background: var(--red); box-shadow: 0 0 6px var(--red); }

    .api-info { flex: 1; min-width: 0; }
    .api-name  { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .api-meta  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 600;
    }
    .badge.version { background: rgba(79,142,247,.15); color: var(--accent); }
    .badge.new     { background: rgba(34,197,94,.15);  color: var(--green); }
    .badge.warn    { background: rgba(245,158,11,.15); color: var(--yellow); }
    .badge.err     { background: rgba(239,68,68,.15);  color: var(--red); }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
    }

    .topbar h1 { font-size: 18px; font-weight: 600; flex: 1; }

    .stats {
      display: flex;
      gap: 8px;
    }

    .stat-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-pill .num { font-weight: 700; font-size: 14px; }
    .stat-pill .num.g { color: var(--green); }
    .stat-pill .num.y { color: var(--yellow); }
    .stat-pill .num.r { color: var(--red); }

    .content { flex: 1; overflow-y: auto; padding: 24px; }

    /* ── DETAIL CARD ── */
    .detail-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
    }

    .detail-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .detail-title { font-size: 22px; font-weight: 700; }
    .detail-desc  { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .detail-tags  { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

    .cards-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .card-value { font-size: 24px; font-weight: 700; }
    .card-sub   { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 10px;
    }

    /* ── ENDPOINT LIST ── */
    .endpoint-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }

    .endpoint {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .endpoint:hover { border-color: var(--accent); }

    .method {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      width: 52px;
      text-align: center;
      flex-shrink: 0;
    }
    .method.get    { background: rgba(34,197,94,.15);  color: var(--green); }
    .method.post   { background: rgba(79,142,247,.15); color: var(--accent); }
    .method.put    { background: rgba(245,158,11,.15); color: var(--yellow); }
    .method.delete { background: rgba(239,68,68,.15);  color: var(--red); }

    .ep-path { font-size: 13px; font-family: monospace; flex: 1; color: var(--text); }
    .ep-desc { font-size: 12px; color: var(--muted); }
    .ep-tag  { margin-left: auto; }

    /* ── ENV ROW ── */
    .env-row {
      display: flex; gap: 12px; margin-bottom: 24px;
    }

    .env-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .env-name { font-size: 13px; font-weight: 600; }
    .env-url  { font-size: 11px; color: var(--muted); font-family: monospace; margin-top: 2px; }

    /* ── EMPTY ── */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
    }
    .empty-icon { font-size: 48px; }
    .empty h2   { font-size: 18px; font-weight: 600; color: var(--text); }
    .empty p    { font-size: 14px; text-align: center; max-width: 300px; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">i</div>
      <div>
        <div class="logo-text">iCore</div>
        <div class="logo-sub">API Control Tower</div>
      </div>
    </div>
    <input class="search" id="search" placeholder="Sök API..." oninput="filterApis(this.value)" />
  </div>

  <div class="sidebar-section">Registrerade API:er</div>
  <div class="api-list" id="apiList"></div>
</aside>

<!-- MAIN -->
<main class="main">
  <header class="topbar">
    <h1 id="topTitle">API Control Tower</h1>
    <div class="stats">
      <div class="stat-pill"><span class="num g" id="countOk">0</span> Online</div>
      <div class="stat-pill"><span class="num y" id="countWarn">0</span> Varning</div>
      <div class="stat-pill"><span class="num r" id="countErr">0</span> Offline</div>
    </div>
  </header>
  <div class="content" id="content">
    <div class="empty" id="emptyState">
      <div class="empty-icon">🗼</div>
      <h2>Välj ett API</h2>
      <p>Välj ett API i listan till vänster för att se detaljer, endpoints och miljöer.</p>
    </div>
    <div id="detail" style="display:none"></div>
  </div>
</main>

<script>
const apis = [
  {
    id: 1,
    name: "Customer API",
    description: "Hanterar kunddata, profiler och kontoinformation för alla iCore-kunder.",
    icon: "👤",
    iconBg: "#1e3a5f",
    status: "green",
    version: "v2.4.1",
    owner: "Backend Team",
    lastDeploy: "idag 08:42",
    uptime: "99.98%",
    callsToday: "14 820",
    avgLatency: "42 ms",
    openIssues: "0",
    envs: [
      { name: "Produktion", url: "https://api.icore.se/customer", status: "green" },
      { name: "Test", url: "https://test-api.icore.se/customer", status: "green" },
      { name: "Lokal", url: "http://localhost:5001/customer", status: "yellow" }
    ],
    endpoints: [
      { method: "GET",    path: "/api/customers",         desc: "Lista alla kunder" },
      { method: "GET",    path: "/api/customers/{id}",    desc: "Hämta specifik kund" },
      { method: "POST",   path: "/api/customers",         desc: "Skapa ny kund" },
      { method: "PUT",    path: "/api/customers/{id}",    desc: "Uppdatera kund" },
      { method: "DELETE", path: "/api/customers/{id}",    desc: "Ta bort kund" },
      { method: "GET",    path: "/api/customers/search",  desc: "Sök kunder" }
    ]
  },
  {
    id: 2,
    name: "Order API",
    description: "Orderhantering, statusuppdateringar och orderhistorik.",
    icon: "📦",
    iconBg: "#1a3a2a",
    status: "green",
    version: "v3.1.0",
    owner: "Order Team",
    lastDeploy: "igår 14:15",
    uptime: "99.95%",
    callsToday: "28 440",
    avgLatency: "67 ms",
    openIssues: "1",
    envs: [
      { name: "Produktion", url: "https://api.icore.se/order", status: "green" },
      { name: "Test", url: "https://test-api.icore.se/order", status: "green" }
    ],
    endpoints: [
      { method: "GET",  path: "/api/orders",              desc: "Lista ordrar" },
      { method: "GET",  path: "/api/orders/{id}",         desc: "Hämta order" },
      { method: "POST", path: "/api/orders",              desc: "Skapa order" },
      { method: "PUT",  path: "/api/orders/{id}/status",  desc: "Uppdatera status" },
      { method: "GET",  path: "/api/orders/{id}/history", desc: "Orderhistorik" }
    ]
  },
  {
    id: 3,
    name: "Notification API",
    description: "Skickar notifieringar via e-post, SMS och push. Hanterar mallar och utskicksloggar.",
    icon: "🔔",
    iconBg: "#3a2a0a",
    status: "yellow",
    version: "v1.8.3",
    owner: "Platform Team",
    lastDeploy: "3 dagar sedan",
    uptime: "97.20%",
    callsToday: "6 100",
    avgLatency: "210 ms",
    openIssues: "3",
    envs: [
      { name: "Produktion", url: "https://api.icore.se/notification", status: "yellow" },
      { name: "Test", url: "https://test-api.icore.se/notification", status: "green" }
    ],
    endpoints: [
      { method: "POST", path: "/api/notifications/email", desc: "Skicka e-post" },
      { method: "POST", path: "/api/notifications/sms",   desc: "Skicka SMS" },
      { method: "GET",  path: "/api/notifications/log",   desc: "Utskickslogg" },
      { method: "GET",  path: "/api/templates",           desc: "Lista mallar" },
      { method: "POST", path: "/api/templates",           desc: "Skapa mall" }
    ]
  },
  {
    id: 4,
    name: "Integration Hub API",
    description: "Kärnan i iCore. Hanterar kopplingar, dataflöden och transformationer mellan system.",
    icon: "⚡",
    iconBg: "#2a1a4a",
    status: "green",
    version: "v4.0.2",
    owner: "Core Team",
    lastDeploy: "idag 06:00",
    uptime: "99.99%",
    callsToday: "91 300",
    avgLatency: "28 ms",
    openIssues: "0",
    envs: [
      { name: "Produktion", url: "https://api.icore.se/hub", status: "green" },
      { name: "Test", url: "https://test-api.icore.se/hub", status: "green" },
      { name: "Staging", url: "https://staging-api.icore.se/hub", status: "green" }
    ],
    endpoints: [
      { method: "GET",  path: "/api/connections",               desc: "Lista alla kopplingar" },
      { method: "POST", path: "/api/connections",               desc: "Skapa koppling" },
      { method: "GET",  path: "/api/connections/{id}/status",   desc: "Kopplingsstatus" },
      { method: "POST", path: "/api/flows/{id}/trigger",        desc: "Trigga dataflöde" },
      { method: "GET",  path: "/api/flows/{id}/log",            desc: "Flödeslogg" },
      { method: "PUT",  path: "/api/connections/{id}/config",   desc: "Konfigurera koppling" }
    ]
  },
  {
    id: 5,
    name: "Auth API",
    description: "Autentisering och auktorisering. JWT-tokens, roller och behörigheter.",
    icon: "🔐",
    iconBg: "#3a1a1a",
    status: "red",
    version: "v2.0.1",
    owner: "Security Team",
    lastDeploy: "5 dagar sedan",
    uptime: "94.10%",
    callsToday: "—",
    avgLatency: "—",
    openIssues: "5",
    envs: [
      { name: "Produktion", url: "https://auth.icore.se", status: "red" },
      { name: "Test", url: "https://test-auth.icore.se", status: "green" }
    ],
    endpoints: [
      { method: "POST", path: "/api/auth/login",      desc: "Logga in, hämta token" },
      { method: "POST", path: "/api/auth/refresh",    desc: "Förnya token" },
      { method: "POST", path: "/api/auth/logout",     desc: "Logga ut" },
      { method: "GET",  path: "/api/users/{id}/roles",desc: "Hämta roller" },
      { method: "PUT",  path: "/api/users/{id}/roles",desc: "Uppdatera roller" }
    ]
  }
];

let selected = null;

function statusColor(s) {
  return s === "green" ? "green" : s === "yellow" ? "yellow" : "red";
}

function buildSidebar(list) {
  const el = document.getElementById("apiList");
  el.innerHTML = list.map(a => `
    <div class="api-item ${selected === a.id ? 'active' : ''}" onclick="selectApi(${a.id})">
      <span class="dot ${statusColor(a.status)}"></span>
      <div class="api-info">
        <div class="api-name">${a.name}</div>
        <div class="api-meta">${a.owner} · ${a.lastDeploy}</div>
      </div>
      <span class="badge version">${a.version}</span>
    </div>
  `).join("");
}

function updateStats() {
  document.getElementById("countOk").textContent   = apis.filter(a => a.status === "green").length;
  document.getElementById("countWarn").textContent = apis.filter(a => a.status === "yellow").length;
  document.getElementById("countErr").textContent  = apis.filter(a => a.status === "red").length;
}

function methodClass(m) {
  return m.toLowerCase();
}

function envDot(s) {
  return `<span class="dot ${statusColor(s)}" style="flex-shrink:0"></span>`;
}

function selectApi(id) {
  selected = id;
  const api = apis.find(a => a.id === id);
  document.getElementById("topTitle").textContent = api.name;
  document.getElementById("emptyState").style.display = "none";
  const detail = document.getElementById("detail");
  detail.style.display = "block";

  const issuesBadge = api.openIssues === "0"
    ? `<span class="badge new">Inga issues</span>`
    : `<span class="badge ${api.openIssues >= 3 ? 'err' : 'warn'}">${api.openIssues} issue${api.openIssues > 1 ? 's' : ''}</span>`;

  detail.innerHTML = `
    <div class="detail-header">
      <div class="detail-icon" style="background:${api.iconBg}">${api.icon}</div>
      <div>
        <div class="detail-title">${api.name}</div>
        <div class="detail-desc">${api.description}</div>
        <div class="detail-tags">
          <span class="badge version">${api.version}</span>
          ${issuesBadge}
          <span class="badge ${api.status === 'green' ? 'new' : api.status === 'yellow' ? 'warn' : 'err'}">
            ${api.status === 'green' ? 'Online' : api.status === 'yellow' ? 'Degraderad' : 'Offline'}
          </span>
        </div>
      </div>
    </div>

    <div class="cards-row">
      <div class="card">
        <div class="card-label">Uptime</div>
        <div class="card-value" style="color:${api.status === 'red' ? 'var(--red)' : api.status === 'yellow' ? 'var(--yellow)' : 'var(--green)'}">${api.uptime}</div>
        <div class="card-sub">senaste 30 dagarna</div>
      </div>
      <div class="card">
        <div class="card-label">Anrop idag</div>
        <div class="card-value">${api.callsToday}</div>
        <div class="card-sub">requests</div>
      </div>
      <div class="card">
        <div class="card-label">Svarstid</div>
        <div class="card-value">${api.avgLatency}</div>
        <div class="card-sub">genomsnitt</div>
      </div>
      <div class="card">
        <div class="card-label">Senaste deploy</div>
        <div class="card-value" style="font-size:16px;padding-top:4px">${api.lastDeploy}</div>
        <div class="card-sub">${api.owner}</div>
      </div>
    </div>

    <div class="section-title">Miljöer</div>
    <div class="env-row">
      ${api.envs.map(e => `
        <div class="env-card">
          ${envDot(e.status)}
          <div>
            <div class="env-name">${e.name}</div>
            <div class="env-url">${e.url}</div>
          </div>
        </div>
      `).join("")}
    </div>

    <div class="section-title">Endpoints (${api.endpoints.length})</div>
    <div class="endpoint-list">
      ${api.endpoints.map(e => `
        <div class="endpoint">
          <span class="method ${methodClass(e.method)}">${e.method}</span>
          <span class="ep-path">${e.path}</span>
          <span class="ep-desc">${e.desc}</span>
        </div>
      `).join("")}
    </div>
  `;

  buildSidebar(apis);
}

function filterApis(q) {
  const filtered = apis.filter(a =>
    a.name.toLowerCase().includes(q.toLowerCase()) ||
    a.description.toLowerCase().includes(q.toLowerCase())
  );
  buildSidebar(filtered);
}

buildSidebar(apis);
updateStats();
</script>
</body>
</html>
