<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>iCore API Control Tower</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#222538;--border:#2a2d3e;
  --accent:#4f8ef7;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;
  --text:#e2e8f0;--muted:#64748b;
  --nav-h:64px;--top-h:56px;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.4,0,.2,1);will-change:transform}
.screen.hidden{transform:translateX(100%)}

/* ── TOP BAR ── */
.topbar{height:var(--top-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-chip{display:flex;align-items:center;gap:8px}
.logo-icon{width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff}
.logo-label{font-size:14px;font-weight:700}

/* ── LIST SCREEN ── */
.list-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;padding-bottom:calc(var(--nav-h) + 8px)}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:26px;font-weight:800;line-height:1}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.ng{color:var(--green)}.ny{color:var(--yellow)}.nr{color:var(--red)}

.search-wrap{position:relative;margin-bottom:4px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px 11px 38px;color:var(--text);font-size:15px;outline:none}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--muted)}

.section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;padding:8px 4px 4px}

.api-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s}
.api-card:active{background:var(--surface2)}
.api-card-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.api-card-info{flex:1;min-width:0}
.api-card-name{font-size:15px;font-weight:600}
.api-card-meta{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.api-card-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot.g{background:var(--green);box-shadow:0 0 5px var(--green)}
.dot.y{background:var(--yellow);box-shadow:0 0 5px var(--yellow)}
.dot.r{background:var(--red);box-shadow:0 0 5px var(--red)}
.vbadge{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600;background:rgba(79,142,247,.15);color:var(--accent)}
.arr{color:var(--muted);font-size:18px}

/* ── BOTTOM NAV ── */
.bottom-nav{height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:500;transition:color .15s;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-item.active{color:var(--accent)}
.nav-icon{font-size:20px;line-height:1}

/* ── DETAIL SCREEN ── */
.detail-body{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 8px)}

/* ── HERO ── */
.hero{padding:20px 16px 0}
.hero-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hero-icon{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.hero-name{font-size:20px;font-weight:800;line-height:1.2}
.hero-desc{font-size:13px;color:var(--muted);margin-top:3px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:10px;padding:3px 9px;border-radius:99px;font-weight:600}
.b-blue{background:rgba(79,142,247,.15);color:var(--accent)}
.b-ok{background:rgba(34,197,94,.15);color:var(--green)}
.b-warn{background:rgba(245,158,11,.15);color:var(--yellow)}
.b-err{background:rgba(239,68,68,.15);color:var(--red)}
.b-muted{background:rgba(100,116,139,.12);color:var(--muted)}

/* ── METRICS ── */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.metric-val{font-size:22px;font-weight:800}
.metric-sub{font-size:11px;color:var(--muted);margin-top:3px}

/* ── SECTION ── */
.section{padding:0 16px 16px}
.stitle{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}

/* ── ENV CARDS ── */
.env-list{display:flex;flex-direction:column;gap:8px}
.env-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px;display:flex;align-items:center;gap:12px}
.env-name{font-size:14px;font-weight:600}
.env-url{font-size:11px;color:var(--muted);font-family:monospace;margin-top:2px;word-break:break-all}

/* ── ENDPOINTS ── */
.ep-list{display:flex;flex-direction:column;gap:8px}
.ep{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.ep-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.ep-head:active{background:var(--surface2)}
.meth{font-size:10px;font-weight:700;padding:4px 8px;border-radius:5px;width:56px;text-align:center;flex-shrink:0}
.meth.get{background:rgba(34,197,94,.15);color:var(--green)}
.meth.post{background:rgba(79,142,247,.15);color:var(--accent)}
.meth.put{background:rgba(245,158,11,.15);color:var(--yellow)}
.meth.delete{background:rgba(239,68,68,.15);color:var(--red)}
.ep-path{font-size:13px;font-family:monospace;flex:1;word-break:break-all}
.ep-chevron{color:var(--muted);transition:transform .2s;flex-shrink:0}
.ep.open .ep-chevron{transform:rotate(90deg)}
.ep-body{display:none;border-top:1px solid var(--border);padding:14px}
.ep.open .ep-body{display:block}
.ep-desc-text{font-size:13px;color:var(--muted);margin-bottom:12px}
.ep-field{margin-bottom:10px}
.ep-field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px}
.ep-field pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;font-family:monospace;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.try-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.try-btn:active{background:#3d7de6}
.try-resp{background:var(--bg);border:1px solid var(--green);border-radius:8px;padding:10px;font-family:monospace;font-size:11px;color:var(--green);white-space:pre-wrap;word-break:break-all;margin-top:10px;display:none}

/* ── SWAGGER ── */
.swagger-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.swagger-toolbar{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px}
.sw-btn{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;padding:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.sw-btn:active{border-color:var(--accent);color:var(--accent)}
.swagger-json{padding:14px;font-family:monospace;font-size:11px;line-height:1.7;overflow-x:auto;max-height:380px;overflow-y:auto}
.jk{color:#7dd3fc}.js{color:#86efac}.jn{color:#f87171}

/* ── EDIT ── */
.edit-form{display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;font-family:inherit;-webkit-appearance:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:none;min-height:80px}
.tags-wrap{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:5px 11px;font-size:12px}
.tag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 0 0 2px}
.tag-input{background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:5px 13px;color:var(--text);font-size:12px;outline:none;width:120px}
.tag-input:focus{border-color:var(--accent)}
.save-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.save-btn:active{background:#3d7de6}

/* ── ALERT ── */
.alert{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:13px 14px;display:flex;align-items:flex-start;gap:10px;font-size:13px;margin:16px 16px 0}
</style>
</head>
<body>

<!-- LIST SCREEN -->
<div class="screen" id="listScreen">
  <div class="topbar">
    <div class="logo-chip">
      <div class="logo-icon">i</div>
      <div class="logo-label">API Control Tower</div>
    </div>
  </div>

  <div class="list-body">
    <div class="stat-row">
      <div class="stat-card"><div class="stat-num ng" id="cOk">0</div><div class="stat-label">Online</div></div>
      <div class="stat-card"><div class="stat-num ny" id="cWarn">0</div><div class="stat-label">Varning</div></div>
      <div class="stat-card"><div class="stat-num nr" id="cErr">0</div><div class="stat-label">Offline</div></div>
    </div>

    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search" placeholder="Sök API, team eller tagg…" oninput="filterApis(this.value)"/>
    </div>

    <div class="section-label">Registrerade API:er</div>
    <div id="apiList"></div>
  </div>
</div>

<!-- DETAIL SCREEN -->
<div class="screen hidden" id="detailScreen">
  <div class="topbar">
    <div class="back-btn" onclick="goBack()">←</div>
    <div class="topbar-title" id="detailTitle"></div>
    <div class="vbadge" id="detailVersion"></div>
  </div>

  <div class="detail-body" id="detailBody"></div>

  <div class="bottom-nav">
    <div class="nav-item active" data-tab="overview" onclick="setTab('overview')">
      <div class="nav-icon">📊</div><div>Översikt</div>
    </div>
    <div class="nav-item" data-tab="endpoints" onclick="setTab('endpoints')">
      <div class="nav-icon">⚡</div><div>Endpoints</div>
    </div>
    <div class="nav-item" data-tab="swagger" onclick="setTab('swagger')">
      <div class="nav-icon">📄</div><div>Swagger</div>
    </div>
    <div class="nav-item" data-tab="edit" onclick="setTab('edit')">
      <div class="nav-icon">✏️</div><div>Redigera</div>
    </div>
  </div>
</div>

<script>
const apis=[
  {id:1,name:"Customer API",desc:"Hanterar kunddata, profiler och kontoinformation.",icon:"👤",iconBg:"#1e3a5f",status:"green",version:"v2.4.1",owner:"Backend Team",lastDeploy:"idag 08:42",uptime:"99.98%",calls:"14 820",latency:"42 ms",issues:0,tags:["kunder","CRM","core"],
  envs:[{name:"Produktion",url:"https://api.icore.se/customer",s:"green"},{name:"Test",url:"https://test-api.icore.se/customer",s:"green"},{name:"Lokal",url:"http://localhost:5001/customer",s:"yellow"}],
  endpoints:[{m:"GET",p:"/api/customers",d:"Lista alla kunder",params:"?page=1&limit=50",resp:'{\n  "data": [{"id":"c1","name":"Acme AB"}],\n  "total": 142\n}'},{m:"GET",p:"/api/customers/{id}",d:"Hämta specifik kund",params:"{id}: string",resp:'{"id":"c1","name":"Acme AB","email":"info@acme.se"}'},{m:"POST",p:"/api/customers",d:"Skapa ny kund",params:'{\n  "name": "string",\n  "email": "string"\n}',resp:'{"id":"c99","name":"Ny Kund"}'},{m:"PUT",p:"/api/customers/{id}",d:"Uppdatera kund",params:"{id} + body",resp:'{"success":true}'},{m:"DELETE",p:"/api/customers/{id}",d:"Ta bort kund",params:"{id}: string",resp:'{"deleted":true}'}]},
  {id:2,name:"Order API",desc:"Orderhantering, statusuppdateringar och orderhistorik.",icon:"📦",iconBg:"#1a3a2a",status:"green",version:"v3.1.0",owner:"Order Team",lastDeploy:"igår 14:15",uptime:"99.95%",calls:"28 440",latency:"67 ms",issues:1,tags:["order","e-handel"],
  envs:[{name:"Produktion",url:"https://api.icore.se/order",s:"green"},{name:"Test",url:"https://test-api.icore.se/order",s:"green"}],
  endpoints:[{m:"GET",p:"/api/orders",d:"Lista ordrar",params:"?status=pending",resp:'{"orders":[{"id":"o1","status":"pending"}]}'},{m:"POST",p:"/api/orders",d:"Skapa order",params:'{"customerId":"string","lines":[]}',resp:'{"id":"o99","status":"created"}'},{m:"PUT",p:"/api/orders/{id}/status",d:"Uppdatera status",params:'{"status":"shipped"}',resp:'{"success":true}'},{m:"GET",p:"/api/orders/{id}/history",d:"Orderhistorik",params:"{id}: string",resp:'[{"status":"created"},{"status":"shipped"}]'}]},
  {id:3,name:"Notification API",desc:"Skickar notifieringar via e-post, SMS och push.",icon:"🔔",iconBg:"#3a2a0a",status:"yellow",version:"v1.8.3",owner:"Platform Team",lastDeploy:"3 dagar sedan",uptime:"97.20%",calls:"6 100",latency:"210 ms",issues:3,tags:["notis","e-post","SMS"],
  envs:[{name:"Produktion",url:"https://api.icore.se/notification",s:"yellow"},{name:"Test",url:"https://test-api.icore.se/notification",s:"green"}],
  endpoints:[{m:"POST",p:"/api/notifications/email",d:"Skicka e-post",params:'{"to":"string","templateId":"string"}',resp:'{"queued":true}'},{m:"POST",p:"/api/notifications/sms",d:"Skicka SMS",params:'{"to":"+46…","body":"string"}',resp:'{"sent":true}'},{m:"GET",p:"/api/notifications/log",d:"Utskickslogg",params:"?limit=100",resp:'[{"type":"email","status":"delivered"}]'},{m:"GET",p:"/api/templates",d:"Lista mallar",params:"—",resp:'[{"id":"t1","name":"Orderbekräftelse"}]'}]},
  {id:4,name:"Integration Hub",desc:"Kärnan i iCore. Kopplingar, dataflöden och transformationer.",icon:"⚡",iconBg:"#2a1a4a",status:"green",version:"v4.0.2",owner:"Core Team",lastDeploy:"idag 06:00",uptime:"99.99%",calls:"91 300",latency:"28 ms",issues:0,tags:["integration","hub","kritisk"],
  envs:[{name:"Produktion",url:"https://api.icore.se/hub",s:"green"},{name:"Test",url:"https://test-api.icore.se/hub",s:"green"},{name:"Staging",url:"https://staging-api.icore.se/hub",s:"green"}],
  endpoints:[{m:"GET",p:"/api/connections",d:"Lista alla kopplingar",params:"—",resp:'[{"id":"conn1","name":"ERP Sync","active":true}]'},{m:"POST",p:"/api/connections",d:"Skapa koppling",params:'{"name":"string","type":"erp|crm"}',resp:'{"id":"conn99"}'},{m:"POST",p:"/api/flows/{id}/trigger",d:"Trigga dataflöde",params:"{id}: string",resp:'{"jobId":"j1","status":"queued"}'},{m:"GET",p:"/api/flows/{id}/log",d:"Flödeslogg",params:"{id}: string",resp:'[{"at":"06:01","msg":"Sync started"}]'}]},
  {id:5,name:"Auth API",desc:"Autentisering och auktorisering. JWT-tokens, roller och behörigheter.",icon:"🔐",iconBg:"#3a1a1a",status:"red",version:"v2.0.1",owner:"Security Team",lastDeploy:"5 dagar sedan",uptime:"94.10%",calls:"—",latency:"—",issues:5,tags:["auth","säkerhet","JWT"],
  envs:[{name:"Produktion",url:"https://auth.icore.se",s:"red"},{name:"Test",url:"https://test-auth.icore.se",s:"green"}],
  endpoints:[{m:"POST",p:"/api/auth/login",d:"Logga in",params:'{"username":"string","password":"string"}',resp:'{"token":"eyJ…","expiresIn":3600}'},{m:"POST",p:"/api/auth/refresh",d:"Förnya token",params:'{"refreshToken":"string"}',resp:'{"token":"eyJ…"}'},{m:"GET",p:"/api/users/{id}/roles",d:"Hämta roller",params:"{id}: string",resp:'["admin","editor"]'}]}
];

let selId=null, activeTab="overview";
const dc=s=>s==="green"?"g":s==="yellow"?"y":"r";
const statusLabel=s=>s==="green"?"Online":s==="yellow"?"Degraderad":"Offline";
const statusCls=s=>s==="green"?"b-ok":s==="yellow"?"b-warn":"b-err";

function buildList(list){
  document.getElementById("apiList").innerHTML=list.map(a=>`
    <div class="api-card" onclick="openApi(${a.id})">
      <div class="api-card-icon" style="background:${a.iconBg}">${a.icon}</div>
      <div class="api-card-info">
        <div class="api-card-name">${a.name}</div>
        <div class="api-card-meta">${a.owner} · ${a.lastDeploy}</div>
      </div>
      <div class="api-card-right">
        <span class="dot ${dc(a.status)}"></span>
        <span class="vbadge">${a.version}</span>
      </div>
    </div>`).join("");
}

function updateStats(){
  document.getElementById("cOk").textContent=apis.filter(a=>a.status==="green").length;
  document.getElementById("cWarn").textContent=apis.filter(a=>a.status==="yellow").length;
  document.getElementById("cErr").textContent=apis.filter(a=>a.status==="red").length;
}

function filterApis(q){
  const f=q.toLowerCase();
  buildList(apis.filter(a=>a.name.toLowerCase().includes(f)||a.owner.toLowerCase().includes(f)||a.tags.some(t=>t.toLowerCase().includes(f))));
}

function openApi(id){
  selId=id; activeTab="overview";
  document.getElementById("listScreen").classList.add("hidden");
  document.getElementById("detailScreen").classList.remove("hidden");
  const a=apis.find(x=>x.id===id);
  document.getElementById("detailTitle").textContent=a.name;
  document.getElementById("detailVersion").textContent=a.version;
  setTab("overview");
}

function goBack(){
  document.getElementById("detailScreen").classList.add("hidden");
  document.getElementById("listScreen").classList.remove("hidden");
}

function setTab(tab){
  activeTab=tab;
  document.querySelectorAll(".nav-item").forEach(el=>{
    el.classList.toggle("active",el.dataset.tab===tab);
  });
  const a=apis.find(x=>x.id===selId);
  const renders={overview:renderOverview,endpoints:renderEndpoints,swagger:renderSwagger,edit:renderEdit};
  document.getElementById("detailBody").innerHTML=(renders[tab]||renderOverview)(a);
  document.getElementById("detailBody").scrollTop=0;
}

function renderOverview(a){
  const upC=a.status==="green"?"var(--green)":a.status==="yellow"?"var(--yellow)":"var(--red)";
  const issB=a.issues===0?`<span class="badge b-ok">Inga issues</span>`:`<span class="badge ${a.issues>=3?"b-err":"b-warn"}">${a.issues} issues</span>`;
  return`
    ${a.status==="red"?`<div class="alert">⚠️ <div><strong>API Offline</strong> – ${a.issues} aktiva issues. Kontakta ${a.owner}.</div></div>`:""}
    <div class="hero">
      <div class="hero-top">
        <div class="hero-icon" style="background:${a.iconBg}">${a.icon}</div>
        <div>
          <div class="hero-name">${a.name}</div>
          <div class="hero-desc">${a.desc}</div>
        </div>
      </div>
      <div class="tag-row">
        <span class="badge ${statusCls(a.status)}">${statusLabel(a.status)}</span>
        ${issB}
        ${a.tags.map(t=>`<span class="badge b-muted">${t}</span>`).join("")}
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">Uptime</div><div class="metric-val" style="color:${upC}">${a.uptime}</div><div class="metric-sub">30 dagar</div></div>
      <div class="metric"><div class="metric-label">Anrop idag</div><div class="metric-val">${a.calls}</div><div class="metric-sub">requests</div></div>
      <div class="metric"><div class="metric-label">Svarstid</div><div class="metric-val">${a.latency}</div><div class="metric-sub">genomsnitt</div></div>
      <div class="metric"><div class="metric-label">Senaste deploy</div><div class="metric-val" style="font-size:16px;padding-top:4px">${a.lastDeploy}</div><div class="metric-sub">${a.owner}</div></div>
    </div>
    <div class="section">
      <div class="stitle">Miljöer</div>
      <div class="env-list">${a.envs.map(e=>`
        <div class="env-card">
          <span class="dot ${dc(e.s)}"></span>
          <div><div class="env-name">${e.name}</div><div class="env-url">${e.url}</div></div>
        </div>`).join("")}
      </div>
    </div>`;
}

function renderEndpoints(a){
  return`<div class="section" style="padding-top:16px">
    <div class="stitle">Endpoints (${a.endpoints.length})</div>
    <div class="ep-list">${a.endpoints.map((e,i)=>`
      <div class="ep" id="ep${i}">
        <div class="ep-head" onclick="toggleEp(${i})">
          <span class="meth ${e.m.toLowerCase()}">${e.m}</span>
          <span class="ep-path">${e.p}</span>
          <span class="ep-chevron">›</span>
        </div>
        <div class="ep-body">
          <div class="ep-desc-text">${e.d}</div>
          <div class="ep-field"><label>Parametrar</label><pre>${e.params}</pre></div>
          <div class="ep-field"><label>Exempelsvar</label><pre>${e.resp}</pre></div>
          <button class="try-btn" onclick="tryEp(${a.id},${i})">▶ Testa anrop</button>
          <div class="try-resp" id="resp${a.id}_${i}"></div>
        </div>
      </div>`).join("")}
    </div>
  </div>`;
}

function toggleEp(i){
  document.getElementById("ep"+i).classList.toggle("open");
}

function tryEp(apiId,idx){
  const ep=apis.find(a=>a.id===apiId).endpoints[idx];
  const box=document.getElementById(`resp${apiId}_${idx}`);
  box.style.display="block"; box.textContent="⏳ Anropar…";
  setTimeout(()=>{box.textContent="✅ 200 OK\n\n"+ep.resp},900);
}

function renderSwagger(a){
  const sw={openapi:"3.0.0",info:{title:a.name,version:a.version,description:a.desc},servers:a.envs.map(e=>({url:e.url,description:e.name})),paths:{}};
  a.endpoints.forEach(e=>{if(!sw.paths[e.p])sw.paths[e.p]={};sw.paths[e.p][e.m.toLowerCase()]={summary:e.d,tags:a.tags};});
  const pretty=JSON.stringify(sw,null,2).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"([^"]+)":/g,'<span class="jk">"$1"</span>:')
    .replace(/: "([^"]*)"/g,': <span class="js">"$1"</span>')
    .replace(/: (\d+\.?\d*)/g,': <span class="jn">$1</span>');
  return`<div class="section" style="padding-top:16px">
    <div class="stitle">Swagger / OpenAPI</div>
    <div class="swagger-box">
      <div class="swagger-toolbar">
        <button class="sw-btn" onclick="copySwagger(${a.id})">📋 Kopiera JSON</button>
        <button class="sw-btn" onclick="dlSwagger(${a.id})">⬇ Ladda ner</button>
      </div>
      <div class="swagger-json">${pretty}</div>
    </div>
  </div>`;
}

function copySwagger(id){
  const a=apis.find(x=>x.id===id);
  const sw={openapi:"3.0.0",info:{title:a.name,version:a.version},paths:{}};
  a.endpoints.forEach(e=>{if(!sw.paths[e.p])sw.paths[e.p]={};sw.paths[e.p][e.m.toLowerCase()]={summary:e.d};});
  navigator.clipboard.writeText(JSON.stringify(sw,null,2)).then(()=>alert("Kopierat!"));
}

function dlSwagger(id){
  const a=apis.find(x=>x.id===id);
  const sw={openapi:"3.0.0",info:{title:a.name,version:a.version},paths:{}};
  a.endpoints.forEach(e=>{if(!sw.paths[e.p])sw.paths[e.p]={};sw.paths[e.p][e.m.toLowerCase()]={summary:e.d};});
  const b=new Blob([JSON.stringify(sw,null,2)],{type:"application/json"});
  const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download=a.name.toLowerCase().replace(/ /g,"-")+"-swagger.json";l.click();
}

function renderEdit(a){
  return`<div class="section" style="padding-top:16px">
    <div class="edit-form">
      <div class="field"><label>API-namn</label><input id="eName" value="${a.name}"/></div>
      <div class="field"><label>Beskrivning</label><textarea id="eDesc">${a.desc}</textarea></div>
      <div class="field"><label>Ansvarig team</label><input id="eOwner" value="${a.owner}"/></div>
      <div class="field"><label>Version</label><input id="eVer" value="${a.version}"/></div>
      <div class="field">
        <label>Taggar</label>
        <div class="tags-wrap" id="tagsWrap">
          ${a.tags.map((t,i)=>`<span class="tag">${t}<button onclick="removeTag(${a.id},${i})">×</button></span>`).join("")}
          <input class="tag-input" placeholder="+ Lägg till…" onkeydown="addTag(event,${a.id})"/>
        </div>
      </div>
      <button class="save-btn" onclick="saveEdit(${a.id})">💾 Spara</button>
    </div>
  </div>`;
}

function removeTag(id,idx){apis.find(x=>x.id===id).tags.splice(idx,1);setTab("edit")}
function addTag(e,id){if(e.key!=="Enter")return;const v=e.target.value.trim();if(!v)return;apis.find(x=>x.id===id).tags.push(v);e.target.value="";setTab("edit")}
function saveEdit(id){
  const a=apis.find(x=>x.id===id);
  a.name=document.getElementById("eName").value;
  a.desc=document.getElementById("eDesc").value;
  a.owner=document.getElementById("eOwner").value;
  a.version=document.getElementById("eVer").value;
  document.getElementById("detailTitle").textContent=a.name;
  document.getElementById("detailVersion").textContent=a.version;
  buildList(apis);
  alert("Sparat!");
}

buildList(apis);
updateStats();
</script>
</body>
</html>
