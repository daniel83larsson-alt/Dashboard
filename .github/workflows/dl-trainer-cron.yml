name: DL Trainer scheduled sync

# Vercel Cron only registers jobs from Production-target deployments, and
# this project's Git connection ("sourceless" link, set up outside the
# normal GitHub App flow) doesn't expose a way to make our actual deploy
# branch count as Production — confirmed both via the Vercel API (every
# attempt to change link.productionBranch is rejected) and the dashboard UI
# (the Production Branch setting isn't present). vercel.json's three cron
# definitions have therefore likely never fired automatically since they
# were written. GitHub Actions' own scheduler was set up as a substitute —
# but it turned out to have NO timing guarantee either: confirmed live
# running 3-6 hours late throughout a single day (see STATUS.md), which is
# actively harmful for things like a "breakfast" reminder arriving at
# lunchtime. The 9 single-call, non-batched routes below (no deliberate
# pacing between requests) have therefore moved to Supabase pg_cron+pg_net
# instead (runs inside Postgres's own scheduler, not a shared external
# queue — see the `add_pg_cron_scheduler_for_low_risk_crons` migration).
# Only the 3 routes that need several sequential, DELIBERATELY-PACED calls
# stay here: sync-all's 25s gaps between Garmin login batches exist
# specifically to avoid re-tripping a real Cloudflare rate-limit incident,
# and weekly-digest/monthly-report's batching exists for Vercel's 60s cap —
# reproducing that pacing safely in pg_cron is a separate, more careful
# follow-up, not done in the same sitting as the 9 simple ones.
# workflow_dispatch below still lists all 12 routes (including the 9 that
# moved) as a manual-testing/backup path — the routes accept either
# CRON_SECRET (this workflow) or SCHEDULER_SECRET (Supabase), so both keep
# working side by side.
on:
  schedule:
    - cron: '0 5 * * *'    # sync-all — matches vercel.json
    - cron: '0 16 * * 0'   # weekly-digest, Sunday only — matches vercel.json (18:00 svensk sommartid)
    - cron: '0 6 1 * *'    # monthly-report, den 1:a varje månad (08:00 svensk sommartid) — matches vercel.json
  workflow_dispatch:
    inputs:
      route:
        description: 'Which route to call (for manual testing)'
        required: true
        type: choice
        options: [sync-all, streak-reminder, isolation-check, prod-smoke, weekly-digest, meal-reminders-breakfast, meal-reminders-lunch, meal-reminders-dinner, meal-reminders-supper, body-reminders, weekly-tdee-recompute, monthly-report]

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which route this trigger is for
        id: route
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            route="${{ inputs.route }}"
            case "$route" in
              meal-reminders-*)
                echo "path=meal-reminders" >> "$GITHUB_OUTPUT"
                echo "meal=${route#meal-reminders-}" >> "$GITHUB_OUTPUT"
                ;;
              *) echo "path=$route" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            case "${{ github.event.schedule }}" in
              "0 5 * * *") echo "path=sync-all" >> "$GITHUB_OUTPUT" ;;
              "0 16 * * 0") echo "path=weekly-digest" >> "$GITHUB_OUTPUT" ;;
              "0 6 1 * *") echo "path=monthly-report" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Call the cron endpoint
        run: |
          call() {
            url="https://dltrainer.se/api/cron/${{ steps.route.outputs.path }}"
            if [ -n "${{ steps.route.outputs.meal }}" ]; then
              url="${url}?meal=${{ steps.route.outputs.meal }}"
            fi
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "$url"
          }
          if [ "${{ steps.route.outputs.path }}" = "weekly-digest" ] || [ "${{ steps.route.outputs.path }}" = "monthly-report" ]; then
            # Batched — a single invocation only fits ~5 users inside Vercel's
            # 60s cap (confirmed by a real timeout during testing for
            # weekly-digest; monthly-report does the same one-Gemini-call-
            # per-user work, so it gets the same treatment), so this calls
            # the route repeatedly. Each call only processes users who don't
            # have this period's record yet, so repeating past "everyone's
            # done" is a safe no-op — just enough calls to drain a growing
            # user base without needing to hand-tune this number often.
            for i in 1 2 3 4 5 6; do
              echo "${{ steps.route.outputs.path }} batch $i"
              call
              echo
            done
          elif [ "${{ steps.route.outputs.path }}" = "sync-all" ]; then
            # Garmin's login endpoint trips Cloudflare's rate limit when too
            # many logins fire back-to-back — verified live: only 2 of 6
            # Garmin users actually synced two nights running, the other 4 all
            # failing with the same 429 (see STATUS.md). A single sync-all
            # call can't just wait longer between logins itself, since it has
            # to finish inside Vercel's 60s cap — so instead this splits
            # Garmin into small batches across several calls, with a real
            # pause between them here (no function-duration limit on a
            # GitHub Actions runner). garminOnly=1 on repeat batches skips
            # Concept2/Strava/Polar/YAZIO/plan-reconcile, which only need to
            # run once a night — only the first call does the full sync.
            # Batch size 2 x 6 batches = headroom for up to 12 Garmin users
            # without needing to hand-tune this soon (same reasoning as
            # weekly-digest's batch count above).
            batchSize=2
            batches=6
            offset=0
            for i in $(seq 1 $batches); do
              echo "sync-all Garmin batch $i (offset $offset)"
              extra=""
              if [ $i -gt 1 ]; then extra="&garminOnly=1"; fi
              curl --fail-with-body -sS \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                "https://dltrainer.se/api/cron/sync-all?garminOffset=$offset&garminLimit=$batchSize$extra"
              echo
              offset=$((offset + batchSize))
              if [ $i -lt $batches ]; then sleep 25; fi
            done
          else
            call
          fi
