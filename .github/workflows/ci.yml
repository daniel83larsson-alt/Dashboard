name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  dl-trainer:
    name: DL Trainer (app/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test
      - name: Build (dummy env — only proves the app compiles, no real backend needed)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BKI8cVnI9T6XcAUFsmWI7a94LCHDAosdn3i9s2vqIVS2cLsYgBuwuIYjdEnzrV6UHgn3XWxfX72eUIqdkqtxrwA

  hemkoll:
    name: Hemkoll (hemkoll/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hemkoll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hemkoll/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build (dummy env — only proves the app compiles, no real backend needed)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
