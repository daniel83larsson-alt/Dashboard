name: DL Trainer nightly demo smoke test

# Test strategy Phase 5 — a real browser walking every page in the app's nav
# against the real deployed production site (dltrainer.se), using the shared
# public "Prova demo" login. Deliberately its own workflow, not a step in
# ci.yml: this watches the live site over time, it doesn't gate pushes/PRs —
# a flaky demo-account smoke test failing should never block someone from
# merging an unrelated change. Failure surfaces the same way the other
# nightly cron workflow's failures already do: GitHub Actions' own built-in
# email notification on a failed scheduled run (see Opus's original test
# strategy plan, referenced in STATUS.md) — no separate alerting wired up
# here on purpose, that channel already exists and works.
on:
  schedule:
    - cron: '0 6 * * *'   # nightly, after sync-all/isolation-check/prod-smoke
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Run demo-account smoke test against production
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14
